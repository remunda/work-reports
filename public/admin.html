<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Správce — Reportování práce</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-inner">
      <span class="brand">📋 Reportování práce — Správce</span>
      <div class="user-info">
        <span id="userLabel"></span>
        <button class="btn small" id="logoutBtn">Odhlásit</button>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="card">
      <h2>Přehled hodin</h2>
      <div class="segmented" id="chartToggle">
        <button data-view="day" class="active">Denně</button>
        <button data-view="week">Týdně</button>
      </div>
      <div class="chart-box">
        <canvas id="summaryChart"></canvas>
      </div>
    </div>

    <div class="card">
      <h2>Všechny reporty</h2>
      <div class="toolbar">
        <label>Filtr podle uživatele:
          <select id="userFilter">
            <option value="all">Všichni</option>
          </select>
        </label>
      </div>
      <div class="table-scroll">
        <table id="reportsTable">
          <thead>
            <tr>
              <th>Uživatel</th>
              <th>Datum</th>
              <th>Hodiny</th>
              <th>Popis</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="empty" id="noReports" style="display:none;">Žádné reporty k zobrazení.</div>
    </div>
  </main>

  <script src="vendor/chart.umd.js"></script>
  <script src="app.js"></script>
</body>
</html>
